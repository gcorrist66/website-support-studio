  <text x="92" y="606" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Crew on-site after hail with temporary tarping and photo log.</text>

  <rect x="466" y="498" width="368" height="165" rx="12" fill="url(#card)" stroke="#e5e3dc"/>
  <text x="488" y="532" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1220" font-weight="700">Roof Inspections</text>
  <rect x="488" y="552" width="322" height="10" fill="#e2e8f0"/>
  <rect x="488" y="570" width="286" height="10" fill="#cbd5e1"/>
  <circle cx="690" cy="605" r="12" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="690" y1="599" x2="690" y2="611" stroke="#2563eb" stroke-width="3"/>
  <line x1="684" y1="605" x2="696" y2="605" stroke="#2563eb" stroke-width="3"/>
  <text x="488" y="632" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Condition findings, recommendations, and estimate-ready notes.</text>

  <rect x="862" y="498" width="276" height="165" rx="12" fill="url(#card)" stroke="#e5e3dc"/>
  <text x="886" y="534" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1220" font-weight="700">Roofing Truck</text>
