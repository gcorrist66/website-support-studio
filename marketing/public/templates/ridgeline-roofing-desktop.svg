      <rect x="52" y="126" width="210" height="8" fill="#1f2937"/>
      <rect x="52" y="136" width="160" height="8" fill="#cbd5e1"/>
      <rect x="52" y="146" width="210" height="8" fill="#cbd5e1"/>
      <rect x="52" y="156" width="178" height="8" fill="#cbd5e1"/>
