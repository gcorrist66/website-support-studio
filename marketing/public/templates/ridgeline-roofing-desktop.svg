  <rect x="900" y="548" width="120" height="38" rx="8" fill="#334155"/>
  <rect x="890" y="600" width="24" height="20" rx="4" fill="#111827"/>
  <rect x="1050" y="600" width="24" height="20" rx="4" fill="#111827"/>
  <circle cx="914" cy="604" r="10" fill="#111827"/>
  <circle cx="1034" cy="604" r="10" fill="#111827"/>
  <text x="887" y="636" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Callout-ready jobs in Denver metro.</text>

  <text x="64" y="730" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">Ridgeline Roofing model home for Founder Website Package demo</text>
