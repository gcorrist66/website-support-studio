  <g transform="translate(40 332)">
    <rect x="0" y="130" width="340" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="22" y="84" width="296" height="54" fill="#ff8f24"/>
    <polygon points="170,84 12,84 170,24 328,84" fill="#f59e0b"/>
    <rect x="34" y="150" width="272" height="12" fill="#94a3b8"/>
